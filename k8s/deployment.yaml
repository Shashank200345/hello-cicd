apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-app, namespace: default}
spec:
  replicas: 2
  selector:
    matchLabels: {app: hello-app}
  template:
    metadata:
      labels: {app: hello-app}
    spec:
      serviceAccountName: hello-app-sa
      containers:
      - name: hello-app
        image: IMAGE_PLACEHOLDER
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: hello-app, namespace: default}
spec:
  selector: {app: hello-app}
  ports: [{port: 80, targetPort: 80}]
