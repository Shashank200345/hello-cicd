apiVersion: v1
kind: ServiceAccount
metadata: {name: jenkins-deployer, namespace: default}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: hello-app-sa, namespace: default}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: deployer-role, namespace: default}
rules:
- apiGroups: ["", "apps"]
  resources: ["deployments", "replicasets", "services", "pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: deployer-binding, namespace: default}
subjects:
- {kind: ServiceAccount, name: jenkins-deployer, namespace: default}
roleRef: {kind: Role, name: deployer-role, apiGroup: rbac.authorization.k8s.io}
